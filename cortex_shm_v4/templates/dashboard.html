{% extends 'base.html' %}{% block content %}<h1>Dashboard</h1><p class="muted">Select a project to view its sensors and the latest 24 hours of telemetry.</p><form method="get" class="panel"><div class="row"><div class="field"><label>Project</label><select name="project_id" onchange="this.form.submit()">{% for p in projects %}<option value="{{p.id}}" {% if p.id==project.id %}selected{% endif %}>{{p.name}}</option>{% endfor %}</select></div></div></form><div class="panel"><h2>{{project.name}}</h2><div class="muted">{{project.site}} · {{project.structure}} · {{project.mode|title}} · {{project.sampling_seconds}} s sampling</div><div id="charts" class="chartgrid" style="margin-top:16px"></div></div><script>
const pid={{project.id|tojson}};let chartRefs=[];async function loadDashboard(){let a=await (await fetch('/api/live?project_id='+pid)).json();let box=document.getElementById('charts');chartRefs.forEach(c=>c.destroy());chartRefs=[];box.innerHTML='';a.forEach(s=>{let d=document.createElement('div');d.className='chartcard';let off=s.data.some(x=>x.status==='OFFLINE');d.innerHTML='<b>'+s.sensor_id+' · '+s.type+'</b><div class="muted">'+s.location+' · '+s.unit+'</div><canvas></canvas><div class="'+(off?'offline':'online')+'">'+(off?'● Sensor Offline':'● Online')+'</div>';box.appendChild(d);let c=new Chart(d.querySelector('canvas'),{type:'line',data:{labels:s.data.map(x=>{let d=new Date(x.timestamp);return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}),datasets:[{data:s.data.map(x=>x.value),pointRadius:0,borderWidth:2,tension:.16,spanGaps:false}]},options:{animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8},title:{display:true,text:'Time'}},y:{title:{display:true,text:s.unit},beginAtZero:false}}}});chartRefs.push(c)})}
loadDashboard();setInterval(loadDashboard,5000);
</script>{% endblock %}
