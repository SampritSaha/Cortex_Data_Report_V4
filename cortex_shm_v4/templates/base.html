<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHM Console</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:#211b28;background:#fff}.sidebar{position:fixed;left:0;top:0;bottom:0;width:237px;background:#d9b9f4;padding:16px 14px;overflow:auto}.logo{height:58px;color:#30203a}.brand{font-size:19px;font-weight:700}.sub{font-size:16px}.group{color:#80628e;margin:22px 10px 9px}.nav{display:block;color:#211b28;text-decoration:none;padding:10px 11px;border-radius:7px;margin:3px 0}.nav:hover,.nav.active{background:#fff}.main{margin-left:237px;min-height:100vh}.top{height:72px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 26px;gap:18px}.crumb{font-size:21px;color:#665c67}.topalert{margin-left:auto;position:relative}.bell{font-size:20px;text-decoration:none;color:#30203a}.badge{position:absolute;top:-7px;right:-9px;background:#b52a2a;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 4px}.content{padding:30px 26px}.muted{color:#81777f}.panel{border:1px solid #e7e1e7;border-radius:12px;padding:18px;margin:18px 0;background:#fff}.row{display:flex;gap:16px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:180px}.field input,.field select{padding:10px;border:1px solid #d8d0db;border-radius:7px;background:#fff}.btn{background:#29172f;color:#fff;border:0;border-radius:7px;padding:11px 19px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}.btn.light{background:#eee7f0;color:#29172f}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #e8e2e9;border-radius:10px;padding:15px}.card b{display:block;font-size:24px;margin-top:4px}.chartgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.chartcard{border:1px solid #e8e2e9;border-radius:10px;padding:12px;height:330px}.chartcard canvas{height:250px!important}.online{color:#26804a;font-weight:700}.offline{color:#b52a2a;font-weight:700}.scope{height:70vh;display:grid;place-items:center;text-align:center;font-size:27px;color:#766d76}.sensor-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.sensor{border:1px solid #e1d9e4;padding:10px;border-radius:7px}.sensor small{display:block;color:#7e747d;margin-top:3px}.notice{background:#faf7fb;border-radius:8px;padding:12px;color:#776d77}.preview{background:#fafafa;border:1px solid #e7e2e7;border-radius:8px;padding:20px}.tag{padding:5px 9px;border-radius:15px;background:#eee4f3}.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.analysis-chart{height:280px}.analysis-chart canvas{height:230px!important}.status-normal{color:#26804a;font-weight:700}.status-alert{color:#b52a2a;font-weight:700}.status-offline{color:#8a6a00;font-weight:700}.alert-row{background:#fff1f1}.alert-link{color:#9d2222;font-weight:700;text-decoration:none}@media(max-width:900px){.sidebar{width:190px}.main{margin-left:190px}.cards,.chartgrid,.sensor-list,.analysis-grid{grid-template-columns:1fr}}
</style></head><body><aside class="sidebar"><div class="logo">🌐<div class="brand">SHM Console</div><div class="sub">Structural monitoring</div></div><div class="group">Operations</div><a class="nav" href="/dashboard">▦ Dashboard</a><a class="nav" href="/analyse">⌁ Analysis</a><a class="nav" href="/alerts">🔔 Alerts</a><div class="group">Fleet</div><a class="nav" href="/devices">▤ Gateways</a><a class="nav" href="/devices">◉ Devices</a><a class="nav" href="/sensors">⌁ Sensors</a><a class="nav" href="/mqtt">∿ MQTT Feed</a><div class="group">Workspace</div><a class="nav" href="/projects">♧ Projects</a><a class="nav" href="/structures">▦ Structures</a><a class="nav" href="/reports">▥ Reports</a><a class="nav" href="/data-download">⇩ Data Download</a><div class="group">Administration</div><a class="nav" href="/users">♙ Users</a><a class="nav" href="/audit">◉ Audit Log</a><a class="nav" href="/settings">⚙ Settings</a></aside><main class="main"><div class="top"><span>☰</span><span class="crumb">SHM › {{title or 'Console'}}</span><div class="topalert"><a class="bell" id="bellLink" href="/alerts" title="Alerts">🔔</a><span id="alertBadge" class="badge" style="display:none">0</span></div><span>A Admin</span></div><div class="content">{% block content %}{% endblock %}</div></main><script>
async function refreshGlobalAlerts(){try{let pid={{project.id|tojson if project is defined else 'PRJ-001'|tojson}};let r=await fetch('/api/alerts?project_id='+encodeURIComponent(pid)+'&rule=IS%20Code');document.getElementById('bellLink').href='/alerts?project_id='+encodeURIComponent(pid);let a=await r.json();let b=document.getElementById('alertBadge');if(a.count>0){b.textContent=a.count;b.style.display='grid'}else b.style.display='none'}catch(e){}}
refreshGlobalAlerts();setInterval(refreshGlobalAlerts,10000);
</script></body></html>
