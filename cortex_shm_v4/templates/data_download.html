{% extends 'base.html' %}{% block content %}<h1>Data Download</h1><p class="muted">Export historical project data. Live charts intentionally show only the latest 24 hours.</p><form method="post" class="panel"><div class="row"><div class="field"><label>Project</label><select name="project_id" onchange="this.form.submit()">{% for p in projects %}<option value="{{p.id}}" {% if p.id==project.id %}selected{% endif %}>{{p.name}}</option>{% endfor %}</select></div><div class="field"><label>From</label><input type="datetime-local" name="start"></div><div class="field"><label>To</label><input type="datetime-local" name="end"></div></div><h3>Select sensors</h3><div class="sensor-list">{% for s in project.sensors %}<label class="sensor"><input type="checkbox" name="sensors" value="{{s.id}}"> <b>{{s.id}}</b><small>{{s.type}} · {{s.location}} · {{s.unit}}</small></label>{% endfor %}</div><div class="notice">Leave all sensors unchecked to export every sensor for this project.</div><button class="btn" type="submit">Prepare Excel Preview</button></form>{% endblock %}
