{% extends 'base.html' %}{% block content %}<h1>Reports</h1><p class="muted">Generate an engineering report for a selected project. Historical ranges are available in the preview.</p><form method="post" action="/report-preview" target="_blank" class="panel"><div class="row"><div class="field"><label>Project</label><select name="project_id">{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></div><div class="field"><label>Start Date/Time</label><input type="datetime-local" name="start"></div><div class="field"><label>End Date/Time</label><input type="datetime-local" name="end"></div><button class="btn">Preview Report</button></div></form><div class="panel"><h2>Live Monitoring · Latest 24 Hours</h2><div id="charts" class="chartgrid"></div></div><script>
const pid={{project.id|tojson}}; async function load(){const r=await fetch('/api/live?project_id='+pid);const a=await r.json();const box=document.getElementById('charts');box.innerHTML='';a.forEach(s=>{let d=document.createElement('div');d.className='chartcard';d.innerHTML='<b>'+s.sensor_id+' · '+s.type+'</b><div class="muted">'+s.location+' · '+s.unit+'</div><canvas></canvas><div class="'+(s.data.some(x=>x.status==='OFFLINE')?'offline':'online')+'">'+(s.data.some(x=>x.status==='OFFLINE')?'● Sensor Offline':'● Online')+'</div>';box.appendChild(d);new Chart(d.querySelector('canvas'),{type:'line',data:{labels:s.data.map(x=>new Date(x.timestamp).toLocaleTimeString()),datasets:[{data:s.data.map(x=>x.value),pointRadius:0,borderWidth:2,tension:.12}]},options:{animation:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{beginAtZero:false}}}})});}load();setInterval(load,5000);
</script>{% endblock %}
